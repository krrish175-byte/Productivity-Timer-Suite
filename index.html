<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Timers Suite</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-button active" data-view="stopwatch">Stopwatch</button>
        <button class="nav-button" data-view="pomodoro">Pomodoro</button>
        <button class="nav-button" data-view="history">History</button>
    </nav>

    <main class="main-container">
        <!-- Stopwatch View -->
        <section id="stopwatch-view" class="view active" data-view="stopwatch">
            <h1>Stopwatch</h1>
            <div class="timer-display" id="stopwatch-display">00:00.00</div>
            <div class="timer-controls">
                <button id="stopwatch-start" class="btn btn-primary">Start</button>
                <button id="stopwatch-pause" class="btn btn-secondary">Pause</button>
                <button id="stopwatch-reset" class="btn btn-secondary">Reset</button>
                <button id="stopwatch-save" class="btn btn-success">Save</button>
            </div>
        </section>

        <!-- Pomodoro View -->
        <section id="pomodoro-view" class="view" data-view="pomodoro">
            <h1>Pomodoro Timer</h1>
            <div class="mode-indicator" id="pomodoro-mode">Work Session</div>
            <div class="timer-display" id="pomodoro-display">25:00</div>
            <div class="timer-controls">
                <button id="pomodoro-start" class="btn btn-primary">Start</button>
                <button id="pomodoro-pause" class="btn btn-secondary">Pause</button>
                <button id="pomodoro-reset" class="btn btn-secondary">Reset</button>
                <button id="pomodoro-save" class="btn btn-success">Save</button>
            </div>
        </section>

        <!-- History View -->
        <section id="history-view" class="view" data-view="history">
            <h1>Session History</h1>
            <div id="history-content">
                <p class="empty-message">No sessions saved yet. Complete a timer session and save it to see it here.</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
